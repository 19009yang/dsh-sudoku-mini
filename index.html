<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sudoku mini · 开发预览</title><style>body{margin:0;font:14px system-ui;background:#f5f6f8;color:#28334b}main{max-width:740px;margin:60px auto;padding:24px}textarea{width:100%;height:140px;padding:14px;font:inherit;border:1px solid #dce2ed;border-radius:10px}button{padding:10px 16px}#stream{min-height:160px;white-space:pre-wrap}p{line-height:1.7}dialog{border:1px solid #ccc;border-radius:12px}</style></head><body><main><h1>Sudoku mini</h1><p>这是插件的独立开发预览。右侧按钮打开数独；此输入框用于检查游戏是否干扰页面键盘操作。</p><div id="stream" aria-live="off"></div><textarea aria-label="宿主输入框" placeholder="输入消息，测试数字、撤销和方向键…"></textarea><p><button id="send">发送</button> <button id="stop">停止</button> <button id="approval">打开审批弹窗</button> <button id="remount">重新挂载插件</button></p></main><dialog><p>模拟宿主审批</p><button id="approve">允许</button></dialog><script type="module" src="/src/preview.ts"></script></body></html>
